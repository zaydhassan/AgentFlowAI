# =============================================================================
# AgentFlow AI — Release pipeline.
# Builds and publishes the production Docker images to GitHub Container
# Registry (GHCR) and (optionally) creates a GitHub Release.
#
# Triggers:
#   • push of a version tag  v*.*.*   (e.g. v0.1.0, v1.2.3-rc1)
#   • workflow_dispatch (manual)        — input an optional image tag override
#
# Images published (one tag per matrix entry):
#   ghcr.io/<owner>/agentflow-ai-web:<version>     + :latest
#   ghcr.io/<owner>/agentflow-ai-worker:<version>  + :latest
# Auth: the auto-provided GITHUB_TOKEN (permissions: packages: write). No extra
# secret required for GHCR. Create a GitHub Release from the tag (contents: write).
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to the git short SHA)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build & publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: agentflow-ai-web
          - dockerfile: Dockerfile.backend
            image: agentflow-ai-worker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          # tag v1.2.3 → :1.2.3, :latest; also tag the git SHA. Manual runs get
          # the input tag (or short SHA).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.tag || github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=AgentFlow AI — ${{ matrix.image }}
            org.opencontainers.image.description=AgentFlow AI ${{ matrix.image }} image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}

  # ---------------------------------------------------------------------------
  # GitHub Release (only on a version tag). Runs after images are published.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
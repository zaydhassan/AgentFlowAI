<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" font-family="Geist, Inter, system-ui, sans-serif">
  <!-- AgentFlow AI — splash screen (1024 square). Flow Loop flows on boot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07080c"/><stop offset="1" stop-color="#0b0e1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.4">
      <stop stop-color="#6366F1" stop-opacity=".20"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="80" y1="80" x2="544" y2="544" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="word" x1="372" y1="0" x2="652" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="430" r="360" fill="url(#glow)"/>

  <!-- Flow Loop, animated (continuous execution on boot) -->
  <g transform="translate(280 180) scale(7.5)">
    <path d="M24 30 L40 30 C40 22 37 15 32 13 C27 15 24 22 24 30 C19 36 12 43 12 53 C19 62 45 62 52 53 C52 43 45 36 40 30 L24 30 Z"
          stroke="url(#loop)" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round" fill="none"
          stroke-dasharray="44 130">
      <animate attributeName="stroke-dashoffset" from="0" to="-174" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <g fill="#7C3AED">
      <circle cx="37" cy="20" r="3.4"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="52" cy="53" r="3.4"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="12" cy="53" r="3.4"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="27" cy="20" r="3.4"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="512" y="820" text-anchor="middle" font-size="86" font-weight="600" letter-spacing="-2" fill="#f4f6fb">
    AgentFlow <tspan fill="url(#word)">AI</tspan>
  </text>
  <text x="512" y="874" text-anchor="middle" font-size="30" font-weight="400" fill="#9aa1b2">
    The AI-Native Automation Platform
  </text>
</svg>
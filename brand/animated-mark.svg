<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- AgentFlow AI — animated mark (final v2): solid loop, a soft highlight travels
       it, and the four cycle nodes pulse in sequence Plan → Reason → Execute → Learn. -->
  <defs>
    <linearGradient id="g" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <path d="M24 30 L40 30 C40 22 37 15 32 13 C27 15 24 22 24 30 C19 36 12 43 12 53 C19 62 45 62 52 53 C52 43 45 36 40 30 L24 30 Z"
        stroke="url(#g)" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M24 30 L40 30 C40 22 37 15 32 13 C27 15 24 22 24 30 C19 36 12 43 12 53 C19 62 45 62 52 53 C52 43 45 36 40 30 L24 30 Z"
        stroke="#ffffff" stroke-opacity=".55" stroke-width="4.1" stroke-linecap="round" stroke-linejoin="round" fill="none"
        stroke-dasharray="44 130">
    <animate attributeName="stroke-dashoffset" from="0" to="-174" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <g fill="#7C3AED">
    <circle cx="37" cy="20" r="3.4"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="52" cy="53" r="3.4"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" begin="0.65s" repeatCount="indefinite"/></circle>
    <circle cx="12" cy="53" r="3.4"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="27" cy="20" r="3.4"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" begin="1.95s" repeatCount="indefinite"/></circle>
  </g>
</svg>